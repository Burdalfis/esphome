name: Fix Suzanne sweep collision

on:
  push:
    branches:
      - agent/c6-async-mipi-dma
    paths:
      - .github/workflows/fix-suzanne-sweep-collision.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma

      - name: Rename sweep-only helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('esphome/components/mipi_spi/suzanne_blender_uv_perspective_64_sweep.h')
          s = p.read_text()
          replacements = {
              'SUZANNE_BLENDER_TEXTURE_SIZE_64': 'SUZANNE_SWEEP_TEXTURE_SIZE_64',
              'suzanne_blender64_expected_uv_count': 'suzanne_blender64_sweep_expected_uv_count',
              'make_suzanne_blender_uv_texture_64': 'make_suzanne_blender_uv_texture_64_sweep',
              'SUZANNE_BLENDER_UV_TEXTURE_64': 'SUZANNE_BLENDER_UV_TEXTURE_64_SWEEP',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Compile both 64x64 headers together
        shell: bash
        run: |
          cat >/tmp/sweep_collision_test.cpp <<'CPP'
          #include <cstddef>
          #include <cstdint>

          namespace esphome {
          struct Color {
            constexpr Color(int, int, int) {}
          };
          }

          #include "esphome/components/mipi_spi/suzanne_blender_uv_perspective_64.h"
          #include "esphome/components/mipi_spi/suzanne_blender_uv_perspective_64_sweep.h"

          struct DummyDisplay {
            uint16_t framebuffer[172 * 320]{};
            uint16_t *get_framebuffer() { return framebuffer; }
            int get_width() const { return 172; }
            int get_height() const { return 320; }
            std::size_t get_framebuffer_stride() const { return 172; }
            uint16_t native_color(const esphome::Color &) const { return 0; }
            void mark_dirty(int, int, int, int) {}
          };

          int main() {
            DummyDisplay display;
            auto a = esphome::mipi_spi::demo3d::render_suzanne_blender_uv_perspective_64(&display, 17, 29);
            auto b = esphome::mipi_spi::demo3d::render_suzanne_blender_uv_perspective_64_sweep(&display, 17, 29);
            return (a.visible_triangles == 0 || b.visible_triangles == 0) ? 1 : 0;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -I. /tmp/sweep_collision_test.cpp -o /tmp/sweep_collision_test
          /tmp/sweep_collision_test

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esphome/components/mipi_spi/suzanne_blender_uv_perspective_64_sweep.h
          git diff --cached --quiet && exit 0
          git commit -m "Fix Suzanne sweep helper collisions [skip ci]"
          git push origin HEAD:agent/c6-async-mipi-dma
