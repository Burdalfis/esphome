name: tmp-fix-direct-edma-bench

on:
  push:
    branches:
      - agent/c6-async-mipi-dma

permissions:
  contents: write

jobs:
  patch-and-compile:
    if: github.event.head_commit.message == 'Add temporary direct EDMA benchmark fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('esphome/components/mipi_rgb/mipi_rgb.cpp')
          s = p.read_text()
          old = '''  if (this->pending_framebuffer_index_ != MIPI_RGB_NO_FRAMEBUFFER) {\n    while (static_cast<uint32_t>(this->frame_done_count_ - this->pending_frame_done_count_) < 2u) {\n'''
          new = '''  if (this->pending_framebuffer_index_ != MIPI_RGB_NO_FRAMEBUFFER) {\n    // Bounce-buffer mode needs the conservative second boundary because a submit\n    // can race a bounce refill that already captured the previous framebuffer.\n    // Direct EDMA's frame-complete event already means the old framebuffer is\n    // safe to reuse, so waiting for a second event can deadlock the handoff.\n    const uint32_t required_completions = this->bounce_buffer_lines_ == 0 ? 1u : 2u;\n    while (static_cast<uint32_t>(this->frame_done_count_ - this->pending_frame_done_count_) < required_completions) {\n'''
          if s.count(old) != 1:
              raise SystemExit('mipi_rgb handoff pattern mismatch')
          p.write_text(s.replace(old, new, 1))

          p = Path('esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h')
          s = p.read_text()
          old = '''  render_suzanne_blender_uv_perspective(display, BENCH_PHASE_X, BENCH_PHASE_Y,\n                                         camera_z, false, false);\n  if (bench.finished)\n    return;\n\n  const SuzanneFrameTiming frame = get_suzanne_frame_timing();\n'''
          new = '''  const PerspectiveStats rendered = render_suzanne_blender_uv_perspective(\n      display, BENCH_PHASE_X, BENCH_PHASE_Y, camera_z, false, false);\n  if (bench.finished)\n    return;\n\n  // Do not turn a failed begin/present into hundreds of copies of the previous\n  // valid timing sample. This fixed scene always rasterizes many triangles.\n  if (rendered.rasterized_triangles == 0 || rendered.perspective_blocks == 0) {\n    ESP_LOGE(SUZANNE_PERF_TAG, \"PCLK_BENCH render did not complete; sample not counted\");\n    return;\n  }\n\n  const SuzanneFrameTiming frame = get_suzanne_frame_timing();\n'''
          if s.count(old) != 1:
              raise SystemExit('benchmark render pattern mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install ESPHome checkout
        run: pip install -e .
      - name: Write benchmark config
        run: |
          cat > /tmp/bench.yaml <<'YAML'
          esphome:
            name: s3-pclk-ci
            includes:
              - <esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h>
          esp32:
            board: esp32-s3-devkitc-1
            variant: esp32s3
            flash_size: 16MB
            framework:
              type: esp-idf
              advanced:
                execute_from_psram: true
          psram:
            mode: octal
            speed: 80MHz
          logger:
          fixed_mesh_3d:
          i2c:
            sda: 8
            scl: 9
          ch422g:
          display:
            - platform: mipi_rgb
              model: ESP32-S3-TOUCH-LCD-7-800X480
              id: lcd_display
              pclk_frequency: 16MHz
              bounce_buffer_lines: 20
              auto_clear_enabled: false
              update_interval: 10ms
              lambda: |-
                esphome::mipi_spi::demo3d::benchmark_suzanne_pclk(id(lcd_display), 500);
          YAML
      - name: Compile bounce mode
        run: esphome compile /tmp/bench.yaml
      - name: Compile direct EDMA mode
        run: |
          sed -i 's/bounce_buffer_lines: 20/bounce_buffer_lines: 0/' /tmp/bench.yaml
          esphome compile /tmp/bench.yaml
      - name: Commit source changes
        run: |
          git config user.name Burdalfis
          git config user.email xelastlaurent@gmail.com
          git add esphome/components/mipi_rgb/mipi_rgb.cpp esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h
          git commit -m 'Fix direct EDMA framebuffer handoff benchmark'
          git push origin HEAD:agent/c6-async-mipi-dma
