name: tmp-s3-pclk-benchmark

on:
  push:
    branches:
      - agent/c6-async-mipi-dma

permissions:
  contents: write

jobs:
  patch-and-compile:
    if: github.event.head_commit.message == 'Fix temporary S3 PCLK benchmark workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply source patch
        run: python .github/tmp_s3_pclk_patch.py

      - name: Install ESPHome checkout
        run: pip install -e .

      - name: Write bounce-buffer benchmark config
        run: |
          cat >/tmp/s3-bench-bounce.yaml <<'EOF'
          esphome:
            name: s3-bench-bounce
            includes:
              - <esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h>
          esp32:
            board: esp32-s3-devkitc-1
            framework:
              type: esp-idf
              advanced:
                execute_from_psram: true
          logger:
          psram:
            mode: octal
            speed: 80MHz
          i2c:
            sda: GPIO8
            scl: GPIO9
          ch422g:
          fixed_mesh_3d:
          display:
            - platform: mipi_rgb
              model: ESP32-S3-TOUCH-LCD-7-800X480
              id: lcd_display
              pclk_frequency: 16MHz
              bounce_buffer_lines: 20
              auto_clear_enabled: false
              update_interval: 10ms
              lambda: |-
                esphome::mipi_spi::demo3d::benchmark_suzanne_pclk(id(lcd_display), 500);
          EOF

      - name: Compile bounce-buffer benchmark
        run: python -m esphome compile /tmp/s3-bench-bounce.yaml

      - name: Compile direct-EDMA benchmark
        run: |
          sed 's/bounce_buffer_lines: 20/bounce_buffer_lines: 0/' /tmp/s3-bench-bounce.yaml >/tmp/s3-bench-direct.yaml
          python -m esphome compile /tmp/s3-bench-direct.yaml

      - name: Commit source changes
        run: |
          git config user.name 'Burdalfis'
          git config user.email 'xelastlaurent@gmail.com'
          git add esphome/components/mipi_rgb/mipi_rgb.h \
                  esphome/components/mipi_rgb/mipi_rgb.cpp \
                  esphome/components/mipi_rgb/display.py \
                  esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h
          git commit -m 'Add S3 PCLK and RGB scanout benchmark'
          git push origin HEAD:agent/c6-async-mipi-dma
