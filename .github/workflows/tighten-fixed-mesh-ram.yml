name: Tighten fixed mesh RAM

on:
  push:
    branches:
      - agent/c6-async-mipi-dma
    paths:
      - .github/workflows/tighten-fixed-mesh-ram.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma

      - name: Apply deterministic projected scratch change
        run: python3 .github/scripts/tighten_fixed_mesh_ram.py

      - name: Strict C++17 mesh renderer test
        shell: bash
        run: |
          cat >/tmp/fixed_mesh_test.cpp <<'CPP'
          #include <algorithm>
          #include <cstddef>
          #include <cstdint>

          namespace esphome {
          struct Color {
            constexpr Color(int, int, int) {}
          };
          }

          #include "esphome/components/mipi_spi/suzanne_blender_uv_perspective.h"

          static_assert(esphome::mipi_spi::demo3d::SUZANNE_FIXED_MESH_TRIANGLE_COUNT == 968,
                        "Suzanne must expand to 968 triangles");
          static_assert(esphome::mipi_spi::demo3d::FIXED_MESH_PERSPECTIVE_BLOCK_PIXELS == 8,
                        "Generic renderer must use 8-pixel perspective blocks");
          static_assert(sizeof(esphome::mipi_spi::demo3d::FixedMeshProjectedVertex) == 24,
                        "Projected scratch vertex must stay at 24 bytes");

          struct DummyDisplay {
            uint16_t framebuffer[172 * 320]{};
            uint16_t *get_framebuffer() { return framebuffer; }
            int get_width() const { return 172; }
            int get_height() const { return 320; }
            std::size_t get_framebuffer_stride() const { return 172; }
            uint16_t native_color(const esphome::Color &) const { return 0; }
            void mark_dirty(int, int, int, int) {}
          };

          int main() {
            using namespace esphome::mipi_spi::demo3d;
            DummyDisplay display;

            auto normal = render_suzanne_blender_uv_perspective(&display, 0, 0, 500);
            const auto normal_mesh = get_suzanne_fixed_mesh_stats();
            if (normal.visible_triangles == 0 || normal_mesh.meshes_drawn != 1 ||
                normal_mesh.input_triangles != 968 || normal_mesh.clipped_triangles != 0)
              return 1;

            auto clipped = render_suzanne_blender_uv_perspective(&display, 0, 0, 300);
            const auto clipped_mesh = get_suzanne_fixed_mesh_stats();
            if (clipped.visible_triangles == 0 || clipped_mesh.clipped_triangles == 0 ||
                clipped_mesh.rasterized_triangles < clipped_mesh.visible_triangles)
              return 2;

            render_suzanne_blender_uv_perspective(&display, 0, 0, 0);
            render_suzanne_blender_uv_perspective(&display, 0, 0, 0);

            FixedMeshRenderer<DummyDisplay, GOURAUD_TOTAL_VERTS> renderer;
            if (!renderer.begin_frame(&display))
              return 3;

            FixedMeshDrawParams left{};
            left.phase_x = 13;
            left.phase_y = 29;
            left.translate_x = -55;
            left.translate_z = 560;
            renderer.draw_mesh(SUZANNE_FIXED_MESH, SUZANNE_BLENDER_FIXED_MATERIAL, left);

            FixedMeshDrawParams right = left;
            right.phase_x = 53;
            right.phase_y = 91;
            right.phase_z = 17;
            right.translate_x = 55;
            renderer.draw_mesh(SUZANNE_FIXED_MESH, SUZANNE_BLENDER_FIXED_MATERIAL, right);

            const auto multi = renderer.end_frame();
            if (multi.meshes_drawn != 2 || multi.input_triangles != 1936 ||
                multi.visible_triangles == 0 || multi.rasterized_triangles == 0 ||
                multi.dirty_bytes == 0)
              return 4;

            return 0;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -I. /tmp/fixed_mesh_test.cpp -o /tmp/fixed_mesh_test
          /tmp/fixed_mesh_test

      - name: Commit runtime changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esphome/components/mipi_spi/fixed_mesh_renderer.h \
                  esphome/components/mipi_spi/suzanne_blender_uv_perspective.h
          git diff --cached --quiet && exit 0
          git commit -m "Keep generic mesh scratch RAM deterministic [skip ci]"
          git push origin HEAD:agent/c6-async-mipi-dma
