name: Fix RGB callback and test performance HUD

on:
  push:
    branches:
      - agent/c6-async-mipi-dma
    paths:
      - .github/scripts/fix_rgb_frame_callback_deprecation.py
      - .github/workflows/fix-rgb-callback-and-test-perf-hud.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply callback fix
        run: python .github/scripts/fix_rgb_frame_callback_deprecation.py
      - name: Verify callback and HUD
        run: |
          grep -q 'ESP_IDF_VERSION_VAL(5, 5, 0)' esphome/components/mipi_rgb/mipi_rgb.cpp
          grep -q 'draw_suzanne_perf_hud_' esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h
          grep -q 'FPS %u.%u' esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h
      - name: Commit callback fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esphome/components/mipi_rgb/mipi_rgb.cpp
          git commit -m 'Use nondeprecated RGB frame-complete callback [skip ci]'
          git push origin HEAD:agent/c6-async-mipi-dma
      - name: Install ESPHome from checkout
        run: pip install -e .
      - name: Write S3 performance HUD test config
        run: |
          cat >/tmp/s3-perf-hud-test.yaml <<'YAML'
          esphome:
            name: s3-perf-hud-test
            includes:
              - <esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h>

          fixed_mesh_3d:

          esp32:
            board: esp32-s3-devkitc-1
            variant: esp32s3
            flash_size: 16MB
            cpu_frequency: 240MHz
            framework:
              type: esp-idf
              advanced:
                execute_from_psram: true

          psram:
            mode: octal
            speed: 80MHz

          logger:

          i2c:
            sda: GPIO8
            scl: GPIO9
            frequency: 400kHz
            id: display_i2c

          ch422g:
            - id: ch422g_hub
              i2c_id: display_i2c

          display:
            - platform: mipi_rgb
              model: ESP32-S3-TOUCH-LCD-7-800X480
              id: lcd_display
              auto_clear_enabled: false
              update_interval: 50ms
              lambda: |-
                static uint8_t phase_x = 0;
                static uint8_t phase_y = 0;
                esphome::mipi_spi::demo3d::render_suzanne_blender_uv_perspective(
                    id(lcd_display), phase_x, phase_y, 500);
                phase_x += 1;
                phase_y += 2;
          YAML
      - name: Compile full S3 firmware
        run: python -m esphome compile /tmp/s3-perf-hud-test.yaml
