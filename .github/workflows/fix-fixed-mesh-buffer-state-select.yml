name: Fix fixed-mesh framebuffer state selector

on:
  push:
    branches:
      - agent/c6-async-mipi-dma
    paths:
      - .github/scripts/fix_fixed_mesh_buffer_state_select.py
      - .github/workflows/fix-fixed-mesh-buffer-state-select.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma
      - name: Apply selector fix
        run: python .github/scripts/fix_fixed_mesh_buffer_state_select.py
      - name: Verify
        run: |
          grep -A2 'bool select_buffer_state_' esphome/components/fixed_mesh_3d/fixed_mesh_renderer.h | grep -q 'buffer_state_ = nullptr'
          grep -A2 'bool select_buffer_state_' esphome/components/mipi_spi/fixed_mesh_renderer.h | grep -q 'buffer_state_ = nullptr'
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esphome/components/fixed_mesh_3d/fixed_mesh_renderer.h esphome/components/mipi_spi/fixed_mesh_renderer.h
          git commit -m 'Fix per-framebuffer renderer state selection [skip ci]'
          git push origin HEAD:agent/c6-async-mipi-dma
