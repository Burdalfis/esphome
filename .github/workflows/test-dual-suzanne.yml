name: Test dual Suzanne

on:
  push:
    branches:
      - agent/c6-async-mipi-dma

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict C++17 dual renderer test
        run: |
          cat > /tmp/test_dual.cpp <<'EOF'
          #include <cstddef>
          #include <cstdint>
          #include <vector>
          namespace esphome {
          struct Color {
            uint8_t r, g, b;
            constexpr Color(uint8_t r_, uint8_t g_, uint8_t b_) : r(r_), g(g_), b(b_) {}
          };
          }
          #include "esphome/components/mipi_spi/suzanne_dual_fixed_mesh.h"

          struct DummyDisplay {
            std::vector<uint16_t> fb = std::vector<uint16_t>(172 * 320);
            uint16_t *get_framebuffer() { return fb.data(); }
            int get_width() const { return 172; }
            int get_height() const { return 320; }
            size_t get_framebuffer_stride() const { return 172; }
            uint16_t native_color(const esphome::Color &c) const {
              return static_cast<uint16_t>(((c.r & 0xF8) << 8) | ((c.g & 0xFC) << 3) | (c.b >> 3));
            }
            void mark_dirty(int, int, int, int) {}
          };

          int main() {
            DummyDisplay display;
            auto stats = esphome::mipi_spi::demo3d::render_dual_suzanne_fixed_mesh(&display, 17, 93);
            const auto &mesh_stats = esphome::mipi_spi::demo3d::get_dual_suzanne_fixed_mesh_stats();
            if (mesh_stats.meshes_drawn != 2) return 1;
            if (mesh_stats.input_triangles != 1936) return 2;
            if (stats.perspective_blocks != mesh_stats.perspective_blocks) return 3;
            return 0;
          }
          EOF
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I. /tmp/test_dual.cpp -o /tmp/test_dual
          /tmp/test_dual
