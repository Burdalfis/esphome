name: Create fixed mesh 3D component

on:
  push:
    branches:
      - agent/c6-async-mipi-dma
    paths:
      - .github/scripts/create_fixed_mesh_3d_component.py
      - .github/workflows/create-fixed-mesh-3d-component.yml

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma
      - name: Create component
        run: python .github/scripts/create_fixed_mesh_3d_component.py
      - name: Verify component
        run: |
          test -f esphome/components/fixed_mesh_3d/__init__.py
          test -f esphome/components/fixed_mesh_3d/fixed_mesh_renderer.h
          test -f esphome/components/fixed_mesh_3d/suzanne_blender_uv_perspective.h
          grep -q 'MALLOC_CAP_SPIRAM' esphome/components/fixed_mesh_3d/fixed_mesh_renderer.h
      - name: Commit component
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esphome/components/fixed_mesh_3d
          git commit -m 'Add transport-neutral fixed mesh 3D component [skip ci]'
          git push origin HEAD:agent/c6-async-mipi-dma
