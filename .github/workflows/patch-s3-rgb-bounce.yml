name: Patch S3 RGB bounce buffers

on:
  push:
    branches:
      - agent/c6-async-mipi-dma
    paths:
      - .github/scripts/patch_s3_rgb_bounce.py
      - .github/workflows/patch-s3-rgb-bounce.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma
      - name: Apply patch
        run: python .github/scripts/patch_s3_rgb_bounce.py
      - name: Verify patch
        run: |
          grep -q 'MIPI_RGB_BOUNCE_BUFFER_LINES = 20' esphome/components/mipi_rgb/mipi_rgb.cpp
          grep -q 'width_ \* MIPI_RGB_BOUNCE_BUFFER_LINES' esphome/components/mipi_rgb/mipi_rgb.cpp
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esphome/components/mipi_rgb/mipi_rgb.cpp
          git commit -m 'Increase ESP32-S3 RGB bounce buffer depth [skip ci]'
          git push origin HEAD:agent/c6-async-mipi-dma
