name: Test S3 direct RGB renderer

on:
  push:
    branches:
      - agent/c6-async-mipi-dma
    paths:
      - .github/workflows/test-s3-direct-rgb-renderer.yml

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ESPHome from checkout
        run: pip install -e .
      - name: Write S3 renderer test config
        run: |
          cat >/tmp/s3-render-test.yaml <<'YAML'
          esphome:
            name: s3-render-test
            includes:
              - <esphome/components/mipi_spi/suzanne_blender_uv_perspective.h>

          esp32:
            board: esp32-s3-devkitc-1
            variant: esp32s3
            flash_size: 16MB
            cpu_frequency: 240MHz
            framework:
              type: esp-idf
              advanced:
                execute_from_psram: true

          psram:
            mode: octal
            speed: 80MHz

          logger:

          i2c:
            sda: GPIO8
            scl: GPIO9
            frequency: 400kHz
            id: display_i2c

          ch422g:
            - id: ch422g_hub
              i2c_id: display_i2c

          display:
            - platform: mipi_rgb
              model: ESP32-S3-TOUCH-LCD-7-800X480
              id: lcd_display
              auto_clear_enabled: false
              update_interval: 50ms
              lambda: |-
                static uint8_t phase_x = 0;
                static uint8_t phase_y = 0;
                esphome::mipi_spi::demo3d::render_suzanne_blender_uv_perspective(
                    id(lcd_display), phase_x, phase_y, 500);
                phase_x += 1;
                phase_y += 2;
          YAML
      - name: Compile
        run: python -m esphome compile /tmp/s3-render-test.yaml
