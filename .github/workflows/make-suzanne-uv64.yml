name: Build Suzanne UV64 renderer

on:
  push:
    branches:
      - agent/c6-async-mipi-dma
    paths:
      - .github/workflows/make-suzanne-uv64.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c6-async-mipi-dma

      - name: Generate 64x64 renderer
        run: python3 .github/scripts/make_suzanne_blender_uv64.py

      - name: Strict C++17 compile test
        shell: bash
        run: |
          cat >/tmp/suzanne_uv64_compile_test.cpp <<'CPP'
          #include <cstddef>
          #include <cstdint>

          namespace esphome {
          struct Color {
            constexpr Color(int, int, int) {}
          };
          }

          #include "esphome/components/mipi_spi/suzanne_blender_uv_perspective_64.h"

          struct DummyDisplay {
            uint16_t framebuffer[172 * 320]{};
            uint16_t *get_framebuffer() { return framebuffer; }
            int get_width() const { return 172; }
            int get_height() const { return 320; }
            std::size_t get_framebuffer_stride() const { return 172; }
            uint16_t native_color(const esphome::Color &) const { return 0; }
            void mark_dirty(int, int, int, int) {}
          };

          int main() {
            DummyDisplay display;
            const auto stats = esphome::mipi_spi::demo3d::render_suzanne_blender_uv_perspective_64(
                &display, 17, 29);
            return stats.visible_triangles == 0 ? 1 : 0;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -I. /tmp/suzanne_uv64_compile_test.cpp -o /tmp/suzanne_uv64_compile_test
          /tmp/suzanne_uv64_compile_test

      - name: Commit generated renderer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esphome/components/mipi_spi/suzanne_blender_uv_perspective_64.h
          git diff --cached --quiet && exit 0
          git commit -m "Add 64x64 Blender UV renderer [skip ci]"
          git push origin HEAD:agent/c6-async-mipi-dma
